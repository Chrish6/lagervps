# nginx-lager.conf
# Reverse proxy-konfiguration som gör att Lager nås via ditt domännamn
# med riktig HTTPS, istället för att prata direkt med Node-servern.
#
# Så här används filen:
#   1. Byt ut "ditt-domän.se" nedan mot ditt riktiga domännamn (två ställen).
#   2. Kopiera filen till servern:
#        sudo cp nginx-lager.conf /etc/nginx/sites-available/lager
#   3. Aktivera den:
#        sudo ln -s /etc/nginx/sites-available/lager /etc/nginx/sites-enabled/
#   4. Testa att konfigurationen är korrekt:
#        sudo nginx -t
#   5. Ladda om nginx:
#        sudo systemctl reload nginx
#   6. Skaffa ett gratis, riktigt HTTPS-certifikat automatiskt:
#        sudo certbot --nginx -d ditt-domän.se
#      (certbot lägger då till HTTPS-inställningarna i den här filen åt dig
#      och sköter automatisk förnyelse — inget mer att göra efter det.)
#
# Kräver att nginx och certbot är installerade:
#   sudo apt install -y nginx certbot python3-certbot-nginx

server {
    listen 80;
    listen [::]:80;
    server_name ditt-domän.se;

    # Skickar all trafik vidare till Lager-servern som körs lokalt på port 3000
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        # Behövs för att appens live-uppdateringar (delta-synk, polling) ska fungera bra
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Bilduppladdning kan vara stor — matcha samma gräns som servern (500mb)
        client_max_body_size 500M;
        proxy_read_timeout 300s;
    }
}
